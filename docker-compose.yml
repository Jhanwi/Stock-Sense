services:

  postgres:
    image: postgres:16-alpine
    container_name: stock-sense-db

    environment:
      POSTGRES_DB: stock_sense
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U stock_user -d stock_sense"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: stock-sense-backend

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stock_sense
      DB_USER: stock_user
      DB_PASSWORD: stock_password
      JWT_SECRET: change-this-secret

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: stock-sense-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data: